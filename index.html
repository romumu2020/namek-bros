// ===== CANVAS =====
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=GW;cv.height=GH;
function resize(){
  const s=Math.min(innerWidth/GW,innerHeight/GH);
  cv.style.width=(GW*s|0)+'px';cv.style.height=(GH*s|0)+'px';
  window._scale=s;
}
addEventListener('resize',resize);resize();

// ===== AUDIO =====
let actx=null;
function initAudio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,dur,type='sine',vol=0.15,slide=0){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=freq;
  if(slide)o.frequency.linearRampToValueAtTime(slide,actx.currentTime+dur);
  g.gain.value=vol;g.gain.linearRampToValueAtTime(0,actx.currentTime+dur);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+dur);
}
function playNoise(dur,vol=0.1){
  if(!actx)return;
  const buf=actx.createBuffer(1,actx.sampleRate*dur|0,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=actx.createBufferSource(),g=actx.createGain();
  s.buffer=buf;g.gain.value=vol;g.gain.linearRampToValueAtTime(0,actx.currentTime+dur);
  s.connect(g);g.connect(actx.destination);s.start();
}
const SFX={
  jump(){playTone(200,0.08,'sine',0.12,600);},
  melee(){playNoise(0.05,0.15);playTone(100,0.03,'square',0.1);},
  kiShoot(){playTone(400,0.15,'sine',0.1,1200);playNoise(0.1,0.06);},
  kiHit(){playNoise(0.03,0.2);playTone(200,0.1,'sine',0.08);},
  hit(){playTone(150,0.1,'sawtooth',0.12);playNoise(0.05,0.1);},
  powerup(){playTone(200,1.5,'sine',0.1,2000);playTone(300,1.5,'triangle',0.06,2200);},
  senzu(){playTone(523,0.1,'sine',0.1);setTimeout(()=>playTone(659,0.1,'sine',0.1),100);setTimeout(()=>playTone(784,0.15,'sine',0.1),200);},
  orb(){playTone(800+orbCombo*50,0.06,'sine',0.08);orbCombo=Math.min(orbCombo+1,20);},
  death(){playTone(800,0.5,'sine',0.12,100);},
  bossIntro(){playTone(60,2,'sawtooth',0.08);playTone(120,2,'sine',0.05);},
  clear(){playTone(523,0.15,'sine',0.12);setTimeout(()=>playTone(659,0.15,'sine',0.12),150);setTimeout(()=>playTone(784,0.25,'sine',0.12),300);},
  transform(){playTone(150,0.8,'sawtooth',0.1,1500);playTone(200,0.8,'triangle',0.06,1800);playNoise(0.4,0.05);},
};
let orbCombo=0;

// ===== INPUT =====
const keys={};
const input={left:false,right:false,up:false,jump:false,jumpHeld:false,melee:false,ki:false,pause:false,start:false,transform:false};
const prevInput={};
addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();initAudio();});
addEventListener('keyup',e=>{keys[e.code]=false;});
function updateInput(){
  Object.assign(prevInput,input);
  input.left=!!(keys.ArrowLeft||keys.KeyA);
  input.right=!!(keys.ArrowRight||keys.KeyD);
  input.up=!!(keys.ArrowUp||keys.KeyW);
  input.jumpHeld=!!(keys.KeyZ||keys.Space);
  input.jump=input.jumpHeld&&!prevInput.jumpHeld;
  input.melee=!!(keys.KeyX)&&!prevInput.melee;
  input.ki=!!(keys.KeyC)&&!prevInput.ki;
  input.pause=!!(keys.Escape||keys.KeyP)&&!(prevInput.pause);
  input.start=!!(keys.Enter||keys.Space||keys.KeyZ)&&!prevInput.start;
  if(touchStartFlag){input.start=true;touchStartFlag=false;}
  // Touch
  for(const t of touchBtns){
    if(t.id==='left')input.left=input.left||t.pressed;
    if(t.id==='right')input.right=input.right||t.pressed;
    if(t.id==='up')input.up=input.up||t.pressed;
    if(t.id==='jump'){
      const wasP=t.wasPressed||false;
      input.jumpHeld=input.jumpHeld||t.pressed;
      input.jump=input.jump||(t.pressed&&!wasP);
      t.wasPressed=t.pressed;
    }
    if(t.id==='melee'){const wasP=t.wasPressed||false;input.melee=input.melee||(t.pressed&&!wasP);t.wasPressed=t.pressed;}
    if(t.id==='ki'){const wasP=t.wasPressed||false;input.ki=input.ki||(t.pressed&&!wasP);t.wasPressed=t.pressed;}
    if(t.id==='transform'){const wasP=t.wasPressed||false;input.transform=input.transform||(t.pressed&&!wasP);t.wasPressed=t.pressed;}
  }
  // re-read held keys for continuous
  if(keys.KeyX)prevInput.melee=true;
  if(keys.KeyC)prevInput.ki=true;
}

// ===== TOUCH =====
let isTouchDevice=false;
let touchStartFlag=false;
const touchBtns=[];
function setupTouch(){
  // D-pad
  touchBtns.push({id:'left',x:20,y:GH-60,w:36,h:40,pressed:false});
  touchBtns.push({id:'right',x:72,y:GH-60,w:36,h:40,pressed:false});
  touchBtns.push({id:'up',x:44,y:GH-100,w:40,h:34,pressed:false});
  // Buttons
  touchBtns.push({id:'jump',x:GW-110,y:GH-50,r:22,pressed:false});
  touchBtns.push({id:'melee',x:GW-60,y:GH-70,r:20,pressed:false});
  touchBtns.push({id:'ki',x:GW-45,y:GH-30,r:20,pressed:false});
  touchBtns.push({id:'transform',x:GW-140,y:GH-90,r:16,pressed:false});
}
setupTouch();

function handleTouch(e){
  isTouchDevice=true;initAudio();
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const s=window._scale||1;
  // Reset all
  for(const b of touchBtns)b.pressed=false;
  for(const touch of e.touches){
    const tx=(touch.clientX-rect.left)/s;
    const ty=(touch.clientY-rect.top)/s;
    for(const b of touchBtns){
      if(b.r){
        if(Math.hypot(tx-b.x,ty-b.y)<b.r+10)b.pressed=true;
      }else{
        if(tx>=b.x-5&&tx<=b.x+b.w+5&&ty>=b.y-5&&ty<=b.y+b.h+5)b.pressed=true;
      }
    }
    // Tap anywhere on title/tutorial/clear/over = start
    if(state===ST.TITLE||state===ST.TUT||state===ST.CLEAR||state===ST.OVER)touchStartFlag=true;
  }
}
document.addEventListener('touchstart',handleTouch,{passive:false});
document.addEventListener('touchmove',handleTouch,{passive:false});
document.addEventListener('touchend',e=>{e.preventDefault();for(const b of touchBtns)b.pressed=false;},{passive:false});

// ===== CAMERA =====
const cam={x:0,y:0,shakeX:0,shakeY:0,shakeT:0};
function updateCam(tx,ty){
  const lookAhead=player.facing*30;
  const targetX=tx-GW/2+lookAhead;
  const targetY=ty-GH/2+20;
  cam.x+=(targetX-cam.x)*0.08;
  cam.y+=(targetY-cam.y)*0.1;
  cam.x=Math.max(0,Math.min(cam.x,(level.width*T)-GW));
  cam.y=Math.max(0,Math.min(cam.y,(level.height*T)-GH));
  if(cam.shakeT>0){cam.shakeT--;cam.shakeX=(Math.random()-0.5)*cam.shakeT*0.8;cam.shakeY=(Math.random()-0.5)*cam.shakeT*0.6;}
  else{cam.shakeX=0;cam.shakeY=0;}
}
function shake(t){cam.shakeT=Math.max(cam.shakeT,t);}

// ===== PARTICLES =====
let particles=[];
function emitP(x,y,count,color,spd=3,life=20){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life,maxLife:life,color,size:1+Math.random()*2});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=p.life/p.maxLife;
    cx.globalAlpha=a;
    cx.fillStyle=p.color;
    cx.fillRect(p.x-cam.x+cam.shakeX-p.size/2|0,p.y-cam.y+cam.shakeY-p.size/2|0,p.size|0,p.size|0);
  }
  cx.globalAlpha=1;
}

// ===== LEVEL =====
let level={tiles:[],width:LW,height:ROWS,entities:[],bossArea:null};

function ground(tiles,x1,x2,h){
  for(let x=x1;x<=x2&&x<LW;x++)
    for(let y=ROWS-h;y<ROWS;y++)
      tiles[y][x]=y===ROWS-h?GRASS:DIRT;
}
function plat(tiles,x1,x2,y){for(let x=x1;x<=x2&&x<LW;x++)tiles[y][x]=PLAT;}
function brick(tiles,x1,x2,y1,y2){
  for(let x=x1;x<=x2&&x<LW;x++)for(let y=y1;y<=y2;y++)tiles[y][x]=BRICK;
}
function wall(tiles,x,y1,y2){for(let y=y1;y<=y2;y++)tiles[y][x]=WALL;}

function metalFloor(tiles,x1,x2,h){

function gravZone(tiles,x1,x2,y1,y2){
  for(let x=x1;x<=x2&&x<LW;x++)for(let y=y1;y<=y2;y++)if(tiles[y][x]===AIR)tiles[y][x]=GRAV;

function panel(tiles,x,y1,y2){for(let y=y1;y<=y2;y++)tiles[y][x]=PANEL;}

function makeDodoria(){
  return{type:'dodoria',x:175*T,y:8*T,vx:0,vy:0,w:20,h:26,
    hp:25,maxHp:25,phase:1,facing:-1,frame:0,hitT:0,dead:false,
    ai:'idle',aiT:50,atkCD:0,animT:0,slamT:0};
}

function updateDodoria(){
  if(!boss||boss.dead)return;
  if(boss.hitT>0)boss.hitT--;
  boss.vy+=GRAVITY;if(boss.vy>MAX_FALL)boss.vy=MAX_FALL;
  boss.y+=boss.vy;collideY(boss);
  boss.facing=player.x<boss.x?-1:1;

  // Phase transitions
  if(boss.hp<=boss.maxHp*0.6&&boss.phase===1){boss.phase=2;shake(8);emitP(boss.x+boss.w/2,boss.y+boss.h/2,12,'#F0F',4,20);}
  if(boss.hp<=boss.maxHp*0.25&&boss.phase===2){boss.phase=3;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#F00',5,25);}

  const spd=boss.phase===3?3.5:boss.phase===2?2.5:1.8;
  boss.aiT--;
  if(boss.aiT<=0){
    const r=Math.random();
    if(boss.ai==='idle'){
      if(boss.phase===3&&r<0.5){boss.ai='charge';boss.aiT=50;boss.vx=boss.facing*spd;}
      else if(r<0.35){boss.ai='charge';boss.aiT=40;boss.vx=boss.facing*spd;}
      else if(r<0.6){boss.ai='slam';boss.aiT=25;boss.vy=JUMP_VEL*1.3;boss.slamT=25;}
      else{boss.ai='shoot';boss.aiT=20;}
    }else if(boss.ai==='charge'){
      boss.ai='idle';boss.aiT=boss.phase===3?15:boss.phase===2?25:35;boss.vx=0;
    }else if(boss.ai==='slam'){
      boss.ai='idle';boss.aiT=25;
    }else if(boss.ai==='shoot'){
      const bx=boss.facing>0?boss.x+boss.w:boss.x-10;
      // Mouth blast (horizontal beam)
      projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*4,vy:0,w:12,h:5,dmg:2,owner:'enemy',color:'#FF66AA',life:60});
      SFX.kiShoot();
      if(boss.phase>=2){
        projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*3.5,vy:-1,w:8,h:5,dmg:1,owner:'enemy',color:'#FF66AA',life:60});
      }
      if(boss.phase===3){
        projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*3,vy:1,w:8,h:5,dmg:1,owner:'enemy',color:'#FF66AA',life:60});
      }
      boss.ai='idle';boss.aiT=boss.phase===3?12:boss.phase===2?20:30;
    }
  }

  if(boss.slamT>0){boss.slamT--;
    if(boss.slamT===1&&boss.onGround){
      shake(12);SFX.hit();
      projectiles.push({x:boss.x-12,y:boss.y+boss.h-6,vx:-3.5,vy:0,w:12,h:5,dmg:2,owner:'enemy',color:'#AA4488',life:35});
      projectiles.push({x:boss.x+boss.w,y:boss.y+boss.h-6,vx:3.5,vy:0,w:12,h:5,dmg:2,owner:'enemy',color:'#AA4488',life:35});
    }
  }

  if(boss.ai==='charge'){boss.x+=boss.vx;
    if(boss.x<157*T){boss.x=157*T;boss.vx*=-1;}
    if(boss.x+boss.w>187*T){boss.x=187*T-boss.w;boss.vx*=-1;}
  }

  boss.animT++;boss.frame=(boss.animT/8|0)%2;
  if(player.invT<=0&&!player.dead&&aabb(boss,player))playerTakeDamage(2);
}

      if(boss.phase>=2&&r<0.2){boss.ai='bodychange';boss.aiT=40;boss.bodyChangeT=40;}
      else if(r<0.4){boss.ai='charge';boss.aiT=35;boss.vx=boss.facing*spd;}
      else if(r<0.65){boss.ai='combo';boss.aiT=20;}
      else{boss.ai='shoot';boss.aiT=15;}
    }else if(boss.ai==='charge'){
      boss.ai='idle';boss.aiT=boss.phase===3?12:20;boss.vx=0;
    }else if(boss.ai==='combo'){
      if(Math.abs(player.x-boss.x)<30)playerTakeDamage(2);
      emitP(boss.x+boss.facing*15+boss.w/2,boss.y+boss.h/2,6,'#A040FF',2,8);SFX.melee();
      boss.ai='idle';boss.aiT=boss.phase===3?10:18;
    }else if(boss.ai==='shoot'){
      const bx=boss.facing>0?boss.x+boss.w:boss.x-8;
      projectiles.push({x:bx,y:boss.y+8,vx:boss.facing*4.5,vy:0,w:10,h:6,dmg:2,owner:'enemy',color:'#AA44FF',life:50});
      SFX.kiShoot();
      if(boss.phase===3){
        projectiles.push({x:bx,y:boss.y+4,vx:boss.facing*4,vy:-1,w:8,h:5,dmg:1,owner:'enemy',color:'#8822DD',life:50});
        projectiles.push({x:bx,y:boss.y+12,vx:boss.facing*4,vy:1,w:8,h:5,dmg:1,owner:'enemy',color:'#8822DD',life:50});
      }
      boss.ai='idle';boss.aiT=boss.phase===3?8:15;
    }else if(boss.ai==='bodychange'){
      boss.ai='idle';boss.aiT=25;
    }
  }
  if(boss.ai==='charge'){boss.x+=boss.vx;
    if(boss.x<157*T){boss.x=157*T;boss.vx*=-1;}
    if(boss.x+boss.w>187*T){boss.x=187*T-boss.w;boss.vx*=-1;}
  }
  boss.animT++;boss.frame=(boss.animT/8|0)%2;
  if(player.invT<=0&&!player.dead&&aabb(boss,player))playerTakeDamage(2);
}

// ===== FRIEZA BOSS =====
function makeFrieza(){
  return{type:'frieza',x:175*T,y:8*T,vx:0,vy:0,w:16,h:22,
    hp:60,maxHp:60,phase:1,facing:-1,frame:0,hitT:0,dead:false,
    ai:'idle',aiT:50,atkCD:0,animT:0,formHP:[15,15,15,15]};
}
function updateFrieza(){
  if(!boss||boss.dead)return;
  if(boss.hitT>0)boss.hitT--;
  boss.vy+=GRAVITY;if(boss.vy>MAX_FALL)boss.vy=MAX_FALL;
  boss.y+=boss.vy;collideY(boss);
  boss.facing=player.x<boss.x?-1:1;
  // Phase transitions based on HP thresholds
  if(boss.hp<=45&&boss.phase===1){boss.phase=2;boss.w=18;boss.h=26;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#CC44FF',5,25);}
  if(boss.hp<=30&&boss.phase===2){boss.phase=3;boss.w=16;boss.h=22;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#FF44AA',5,25);}
  if(boss.hp<=15&&boss.phase===3){boss.phase=4;boss.w=14;boss.h=20;shake(15);emitP(boss.x+boss.w/2,boss.y+boss.h/2,25,'#FFFFFF',6,30);}
  const spd=boss.phase===4?4:boss.phase===3?3.5:boss.phase===2?2.5:2;
  boss.aiT--;
  if(boss.aiT<=0){
    const r=Math.random();
    if(boss.ai==='idle'){
      if(boss.phase===1){
        if(r<0.4){boss.ai='charge';boss.aiT=35;boss.vx=boss.facing*spd;}
        else if(r<0.7){boss.ai='tailwhip';boss.aiT=15;}
        else{boss.ai='deathbeam';boss.aiT=12;}
      }else if(boss.phase===2){
        if(r<0.35){boss.ai='charge';boss.aiT=40;boss.vx=boss.facing*spd;}
        else if(r<0.55){boss.ai='horncharge';boss.aiT=45;boss.vx=boss.facing*4;boss.vy=JUMP_VEL;}
        else{boss.ai='deathbeam';boss.aiT=12;}
      }else if(boss.phase===3){
        if(r<0.3){boss.ai='charge';boss.aiT=30;boss.vx=boss.facing*spd;}
        else if(r<0.6){boss.ai='barrage';boss.aiT=30;}
        else{boss.ai='deathbeam';boss.aiT=10;}
      }else{
        if(r<0.25){boss.ai='charge';boss.aiT=45;boss.vx=boss.facing*spd;}
        else if(r<0.45){boss.ai='barrage';boss.aiT=25;}
        else if(r<0.65){boss.ai='disc';boss.aiT=20;}
        else{boss.ai='deathbeam';boss.aiT=8;}
      }
    }else if(boss.ai==='charge'||boss.ai==='horncharge'){
      boss.ai='idle';boss.aiT=boss.phase>=3?10:20;boss.vx=0;
    }else if(boss.ai==='tailwhip'){
      if(Math.abs(player.x-boss.x)<35)playerTakeDamage(2);
      emitP(boss.x+boss.facing*20,boss.y+boss.h-5,6,'#CC88FF',2,8);SFX.melee();
      boss.ai='idle';boss.aiT=20;
    }else if(boss.ai==='deathbeam'){
      const bx=boss.facing>0?boss.x+boss.w:boss.x-8;
      projectiles.push({x:bx,y:boss.y+6,vx:boss.facing*6,vy:0,w:14,h:3,dmg:2,owner:'enemy',color:'#FF44CC',life:45});
      SFX.kiShoot();
      if(boss.phase===4){
        projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*5.5,vy:0.5,w:10,h:3,dmg:1,owner:'enemy',color:'#FF44CC',life:45});
        projectiles.push({x:bx,y:boss.y+2,vx:boss.facing*5.5,vy:-0.5,w:10,h:3,dmg:1,owner:'enemy',color:'#FF44CC',life:45});
      }
      boss.ai='idle';boss.aiT=boss.phase===4?6:12;
    }else if(boss.ai==='barrage'){
      for(let i=0;i<3;i++){
        const bx=boss.facing>0?boss.x+boss.w:boss.x-6;
        const angle=(i-1)*0.3;
        projectiles.push({x:bx,y:boss.y+6,vx:boss.facing*4,vy:angle*3,w:8,h:4,dmg:1,owner:'enemy',color:'#CC22FF',life:50});
      }
      SFX.kiShoot();
      boss.ai='idle';boss.aiT=boss.phase===4?10:18;
    }else if(boss.ai==='disc'){
      const bx=boss.facing>0?boss.x+boss.w:boss.x-10;
      const dx=player.x-boss.x,dy=player.y-boss.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      projectiles.push({x:bx,y:boss.y+8,vx:dx/d*3.5,vy:dy/d*3.5,w:10,h:10,dmg:3,owner:'enemy',color:'#FFAA00',life:90});
      SFX.kiShoot();shake(5);
      boss.ai='idle';boss.aiT=15;
    }
  }
  if(boss.ai==='charge'||boss.ai==='horncharge'){boss.x+=boss.vx;
    if(boss.x<157*T){boss.x=157*T;boss.vx*=-1;}
    if(boss.x+boss.w>187*T){boss.x=187*T-boss.w;boss.vx*=-1;}
  }
  boss.animT++;boss.frame=(boss.animT/8|0)%2;
  if(player.invT<=0&&!player.dead&&aabb(boss,player))playerTakeDamage(boss.phase>=3?3:2);
}

// ===== PLAYER =====
const FORMS=['base','kaioken','ssj','ssj2','ssj3'];
const FORM_DATA={
  base:{meleeDmg:1,meleeRange:18,kiDmg:1,kiSpd:4,kiMax:1,kiSize:6,kiColor:C.kiYellow,aura:null,hairColor:C.hairBlack,hairStyle:'base'},
  kaioken:{meleeDmg:2,meleeRange:22,kiDmg:2,kiSpd:5,kiMax:1,kiSize:8,kiColor:C.kiRed,aura:C.kaiokenAura,hairColor:C.hairBlack,hairStyle:'base'},
  ssj:{meleeDmg:3,meleeRange:24,kiDmg:3,kiSpd:6,kiMax:2,kiSize:10,kiColor:C.ssjHair,aura:C.ssjAura,hairColor:C.ssjHair,hairStyle:'ssj'},
  ssj2:{meleeDmg:4,meleeRange:26,kiDmg:4,kiSpd:7,kiMax:2,kiSize:12,kiColor:C.ssj2Hair,aura:C.ssj2Aura,hairColor:C.ssj2Hair,hairStyle:'ssj2'},
  ssj3:{meleeDmg:5,meleeRange:28,kiDmg:6,kiSpd:8,kiMax:3,kiSize:14,kiColor:C.ssj3Hair,aura:C.ssj3Aura,hairColor:C.ssj3Hair,hairStyle:'ssj3'},
};
let currentLevel=1;
let maxForm=1; // max form index unlocked

let player={
  x:40,y:200,vx:0,vy:0,w:13,h:22,
  facing:1,form:0,hp:5,maxHp:5,lives:3,
  ki:0,maxKi:100,score:0,
  onGround:false,coyoteT:0,jumpBufT:0,
  invT:0,meleeCD:0,kiCD:0,
  meleeActive:0,meleeDir:1,
  frame:0,animT:0,
  dead:false,transformT:0,
  dragonBalls:0,
};

let projectiles=[];
let enemies=[];
let items=[];
let boss=null;
let bossActive=false;
let bossDefeated=false;
let state=ST.TITLE;
let stateT=0;
let freezeFrames=0;
let titleBlink=0;
let clearT=0;

// ===== COLLISION =====
function tileAt(tx,ty){
  if(tx<0||tx>=level.width||ty<0||ty>=level.height)return AIR;
  return level.tiles[ty][tx];
}
function isSolid(tx,ty){const t=tileAt(tx,ty);return t===GRASS||t===DIRT||t===BRICK||t===WALL||t===METAL||t===PANEL;}
function isPlatform(tx,ty){return tileAt(tx,ty)===PLAT;}
function isBreakable(tx,ty){return tileAt(tx,ty)===BRICK;}

function collideX(e){
  const left=e.x,right=e.x+e.w,top=e.y,bot=e.y+e.h;
  const tl=left/T|0,tr=right/T|0;
  const tt=top/T|0,tb=(bot-1)/T|0;
  for(let ty=tt;ty<=tb;ty++){
    if(e.vx>0&&isSolid(tr,ty)){e.x=tr*T-e.w;e.vx=0;return true;}
    if(e.vx<0&&isSolid(tl,ty)){e.x=(tl+1)*T;e.vx=0;return true;}
  }
  return false;
}

function collideY(e){
  const left=e.x,right=e.x+e.w-1,top=e.y,bot=e.y+e.h;
  const tl=left/T|0,tr=right/T|0;
  e.onGround=false;
  if(e.vy>=0){
    const tby=bot/T|0;
    for(let tx=tl;tx<=tr;tx++){
      if(isSolid(tx,tby)){e.y=tby*T-e.h;e.vy=0;e.onGround=true;return;}
      if(isPlatform(tx,tby)&&(e.y+e.h-e.vy)<=tby*T){e.y=tby*T-e.h;e.vy=0;e.onGround=true;return;}
    }
  }else{
    const tty=top/T|0;
    for(let tx=tl;tx<=tr;tx++){
      if(isSolid(tx,tty)){e.y=(tty+1)*T;e.vy=0;return;}
    }
  }
}

function aabb(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ===== PLAYER UPDATE =====
function updatePlayer(){
  if(player.dead)return;
  if(player.transformT>0){player.transformT--;return;}
  const fd=FORM_DATA[FORMS[player.form]];

  // Movement
  if(input.left){player.vx=-MOVE_SPD;player.facing=-1;}
  else if(input.right){player.vx=MOVE_SPD;player.facing=1;}
  else player.vx=0;

  // Jump buffer
  if(input.jump)player.jumpBufT=JUMP_BUF;
  if(player.jumpBufT>0)player.jumpBufT--;

  // Coyote
  if(player.onGround)player.coyoteT=COYOTE;
  else player.coyoteT=Math.max(0,player.coyoteT-1);

  // Gravity zone check (must be before jump)
  const ptx=(player.x+player.w/2)/T|0,pty=(player.y+player.h/2)/T|0;
  const inGrav=currentLevel===2&&tileAt(ptx,pty)===GRAV;

  // Jump
  if(player.jumpBufT>0&&player.coyoteT>0){
    player.vy=inGrav?JUMP_VEL*0.7:JUMP_VEL;player.jumpBufT=0;player.coyoteT=0;
    SFX.jump();
  }
  // Variable jump
  if(!input.jumpHeld&&player.vy<JUMP_VEL*0.4)player.vy=JUMP_VEL*0.4;
  const grav=inGrav?GRAVITY*2:GRAVITY;
  player.vy+=grav;
  if(player.vy>MAX_FALL)player.vy=MAX_FALL;

  // Move + collide
  player.x+=player.vx;collideX(player);
  player.y+=player.vy;collideY(player);

  // Fall death
  if(player.y>level.height*T+50){playerDie();return;}
  // LASER damage
  const pcx=(player.x+player.w/2)/T|0,pcy=(player.y+player.h/2)/T|0;
  if(tileAt(pcx,pcy)===LASER&&player.invT<=0){playerTakeDamage(2);}
  // Lava damage (L5)
  if(currentLevel===5&&player.y+player.h>lavaY&&player.invT<=0){playerTakeDamage(3);}

  // Invincibility
  if(player.invT>0)player.invT--;

  // Melee
  if(player.meleeCD>0)player.meleeCD--;
  if(input.melee&&player.meleeCD<=0){
    player.meleeActive=8;player.meleeDir=player.facing;player.meleeCD=12;
    SFX.melee();
    // Check hits
    const mx=player.facing>0?player.x+player.w:player.x-fd.meleeRange;
    const mbox={x:mx,y:player.y+2,w:fd.meleeRange,h:player.h-4};
    for(const e of enemies){
      if(!e.dead&&aabb(mbox,e))hitEnemy(e,fd.meleeDmg,player.facing);
    }
    if(boss&&!boss.dead&&aabb(mbox,boss))hitBoss(fd.meleeDmg);
    // Break bricks
    const bx1=(mbox.x/T)|0,bx2=((mbox.x+mbox.w)/T)|0;
    const by1=(mbox.y/T)|0,by2=((mbox.y+mbox.h)/T)|0;
    for(let bx=bx1;bx<=bx2;bx++)for(let by=by1;by<=by2;by++){
      if(isBreakable(bx,by)){level.tiles[by][bx]=AIR;emitP(bx*T+8,by*T+8,6,C.brick,2,15);shake(3);}
    }
  }
  if(player.meleeActive>0)player.meleeActive--;

  // Ki blast
  if(player.kiCD>0)player.kiCD--;
  if(input.ki&&player.kiCD<=0){
    const activeKi=projectiles.filter(p=>p.owner==='player').length;
    if(activeKi<fd.kiMax){
      const px=player.facing>0?player.x+player.w+2:player.x-fd.kiSize-2;
      projectiles.push({x:px,y:player.y+8,vx:player.facing*fd.kiSpd,vy:0,w:fd.kiSize,h:fd.kiSize*0.7,
        dmg:fd.kiDmg,owner:'player',color:fd.kiColor,life:60});
      player.kiCD=20;SFX.kiShoot();
    }
  }

  // Transform
  if((input.transform||(input.up&&input.jump))&&player.ki>=player.maxKi&&player.form<maxForm){
    player.form++;player.ki=0;player.transformT=30;
    SFX.transform();emitP(player.x+player.w/2,player.y+player.h/2,20,C.kiYellow,4,30);shake(8);
  }

  // Animation
  player.animT++;
  if(Math.abs(player.vx)>0.5&&player.onGround)player.frame=(player.animT/6|0)%4;
  else if(!player.onGround)player.frame=5;
  else player.frame=0;

  // Collect items
  const pbox={x:player.x,y:player.y,w:player.w,h:player.h};
  for(const it of items){
    if(it.collected)continue;
    const ibox={x:it.x-5,y:it.y-5,w:10,h:10};
    if(aabb(pbox,ibox)){
      it.collected=true;
      if(it.type==='orb'){player.ki=Math.min(player.ki+5,player.maxKi);player.score+=10;SFX.orb();emitP(it.x,it.y,4,C.orbGlow,2,10);}
      if(it.type==='senzu'){player.hp=player.maxHp;SFX.senzu();emitP(it.x,it.y,8,C.senzu,3,15);}
      if(it.type==='dragonball'){player.dragonBalls++;SFX.clear();emitP(it.x,it.y,12,C.dbOrange,3,20);shake(5);}
    }
  }

  // Boss arena lock
  const bossZone=currentLevel===1?[150,180]:(currentLevel>=2&&currentLevel<=5)?[156,188]:null;
  if(bossZone&&!bossActive&&!bossDefeated&&player.x>bossZone[0]*T&&player.x<bossZone[1]*T){
    bossActive=true;state=ST.INTRO;stateT=90;
    // Seal left wall to lock player in arena
    const lw=bossZone[0];for(let y=0;y<level.height;y++)level.tiles[y][lw]=WALL;
    if(currentLevel===1)boss=makeRaditz();
    else if(currentLevel===2)boss=makeGravBot();
    else if(currentLevel===3)boss=makeDodoria();
    else if(currentLevel===4)boss=makeGinyu();
    else if(currentLevel===5)boss=makeFrieza();
    SFX.bossIntro();
  }
}

function hitEnemy(e,dmg,dir){
  e.hp-=dmg;e.hitT=10;
  e.vx=dir*3;
  emitP(e.x+e.w/2,e.y+e.h/2,5,'#FFF',2,10);
  shake(3);freezeFrames=3;SFX.kiHit();
  if(e.hp<=0){e.dead=true;player.score+=50;emitP(e.x+e.w/2,e.y+e.h/2,10,C.kiYellow,3,15);}
}

function playerTakeDamage(dmg){
  if(player.invT>0||player.dead)return;
  player.hp-=dmg;player.invT=90;
  SFX.hit();shake(5);emitP(player.x+player.w/2,player.y+player.h/2,8,'#F44',3,12);
  if(player.hp<=0){
    if(player.form>0){player.form--;player.hp=player.maxHp;emitP(player.x+player.w/2,player.y+player.h/2,15,C.kiYellow,4,20);}
    else{playerDie();}
  }
}

function playerDie(){
  player.dead=true;player.lives--;SFX.death();
  emitP(player.x+player.w/2,player.y+player.h/2,20,'#F44',4,25);
  setTimeout(()=>{
    if(player.lives>0){respawnPlayer();}
    else{state=ST.OVER;stateT=0;}
  },1500);
}

function respawnPlayer(){
  player.dead=false;player.hp=player.maxHp;player.invT=120;
  player.vy=0;player.vx=0;
  if(bossActive){
    if(currentLevel===1){player.x=155*T;player.y=10*T;}
    else{player.x=160*T;player.y=12*T;}
  }else{
    player.x=40;player.y=currentLevel>=2?12*T:200;
  }
  player.form=currentLevel>=5?4:currentLevel>=4?3:currentLevel>=3?2:currentLevel===2?1:0;
  if(currentLevel===5)lavaY=ROWS*T+50;
}

// ===== ENEMY AI =====
function updateEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    if(e.hitT>0)e.hitT--;

    // Off-screen skip (but keep nearby)
    const dx=e.x-(player.x);
    if(Math.abs(dx)>GW)continue;

    if(e.type==='saibaman'){
      e.x+=e.vx;e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;e.y+=e.vy;
      collideY(e);
      // Patrol: reverse at edges or walls
      const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
      const feetTy=((e.y+e.h+2)/T)|0;
      const headTy=(e.y/T)|0;
      if(!isSolid(frontTx,feetTy)&&!isPlatform(frontTx,feetTy)||isSolid(frontTx,headTy)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
      e.animT=(e.animT||0)+1;e.frame=(e.animT/8|0)%2;
      // Damage player
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='dummy'){
      // Stationary, just sits there
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='dino'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;
      const distToPlayer=player.x-e.x;
      if(e.chargeT>0){
        e.x+=e.facing*e.chargeSp;e.chargeT--;
        if(e.chargeT<=0)e.vx=0;
      }else if(Math.abs(distToPlayer)<e.detectRange&&!player.dead){
        e.facing=distToPlayer>0?1:-1;e.chargeT=30;
      }else{
        // Idle patrol
        e.x+=e.vx*0.5;
        const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
        const feetTy=((e.y+e.h+2)/T)|0;
        if(!isSolid(frontTx,feetTy)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
        if(e.vx===0){e.vx=0.8;e.facing=1;}
      }
      e.y+=e.vy;collideY(e);
      e.animT=(e.animT||0)+1;e.frame=(e.animT/10|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(2);
    }

    if(e.type==='robot'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;
      const distToPlayer=player.x-e.x;
      if(Math.abs(distToPlayer)<e.detectRange&&!player.dead){
        e.facing=distToPlayer>0?1:-1;
        e.vx=0;
        if(e.shootCD<=0){
          const bx=e.facing>0?e.x+e.w:e.x-6;
          projectiles.push({x:bx,y:e.y+6,vx:e.facing*3.5,vy:0,w:6,h:3,dmg:1,owner:'enemy',color:'#F44',life:50});
          SFX.kiShoot();e.shootCD=50;
        }
      }else{
        e.x+=e.vx;
        const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
        const feetTy=((e.y+e.h+2)/T)|0;
        const headTy=(e.y/T)|0;
        if(!isSolid(frontTx,feetTy)||isSolid(frontTx,headTy)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
      }
      if(e.shootCD>0)e.shootCD--;
      e.y+=e.vy;collideY(e);
      e.animT=(e.animT||0)+1;e.frame=(e.animT/10|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='drone'){
      e.sineT+=0.04;
      e.y=e.baseY+Math.sin(e.sineT)*25;
      e.x+=e.driftSpd;
      if(e.x>e.baseX+60||e.x<e.baseX-60)e.driftSpd*=-1;
      if(!e.baseX)e.baseX=e.x;
      e.animT=(e.animT||0)+1;e.frame=(e.animT/8|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='soldier'){
      e.x+=e.vx;e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;e.y+=e.vy;
      collideY(e);
      const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
      const feetTy=((e.y+e.h+2)/T)|0;
      if(!isSolid(frontTx,feetTy)||isSolid(frontTx,(e.y/T)|0)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
      e.animT=(e.animT||0)+1;e.frame=(e.animT/8|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='frog'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;e.y+=e.vy;collideY(e);
      const dist=player.x-e.x;
      if(e.jumpCD>0)e.jumpCD--;
      if(Math.abs(dist)<e.detectRange&&e.onGround&&e.jumpCD<=0&&!player.dead){
        e.facing=dist>0?1:-1;
        e.vy=JUMP_VEL*0.9;e.vx=e.facing*2.5;e.jumpCD=40;
      }
      if(!e.onGround){e.x+=e.vx;}else{e.vx*=0.8;}
      e.animT=(e.animT||0)+1;e.frame=e.onGround?0:1;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='cui'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;
      const dist=player.x-e.x;
      if(Math.abs(dist)<e.detectRange&&!player.dead){
        e.facing=dist>0?1:-1;e.vx=0;
        if(e.shootCD<=0){
          const bx=e.facing>0?e.x+e.w:e.x-6;
          projectiles.push({x:bx,y:e.y+6,vx:e.facing*4,vy:0,w:7,h:4,dmg:1,owner:'enemy',color:'#9966FF',life:50});
          SFX.kiShoot();e.shootCD=40;
        }
      }else{
        e.x+=e.vx;
        const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
        const feetTy=((e.y+e.h+2)/T)|0;
        if(!isSolid(frontTx,feetTy)||isSolid(frontTx,(e.y/T)|0)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
        if(e.vx===0){e.vx=0.5;e.facing=1;}
      }
      if(e.shootCD>0)e.shootCD--;
      e.y+=e.vy;collideY(e);
      e.animT=(e.animT||0)+1;e.frame=(e.animT/10|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }

    if(e.type==='grunt'){
      e.vy+=GRAVITY;if(e.vy>MAX_FALL)e.vy=MAX_FALL;
      const dist=player.x-e.x;
      if(e.chargeT>0){e.x+=e.facing*e.chargeSp;e.chargeT--;if(e.chargeT<=0)e.vx=0;}
      else if(Math.abs(dist)<e.detectRange&&!player.dead){e.facing=dist>0?1:-1;e.chargeT=35;}
      else{
        e.x+=e.vx*0.5;
        const frontTx=((e.vx>0?e.x+e.w+2:e.x-2)/T)|0;
        const feetTy=((e.y+e.h+2)/T)|0;
        if(!isSolid(frontTx,feetTy)){e.vx*=-1;e.facing=e.vx>0?1:-1;}
        if(e.vx===0){e.vx=0.7;e.facing=1;}
      }
      e.y+=e.vy;collideY(e);
      e.animT=(e.animT||0)+1;e.frame=(e.animT/10|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(2);
    }

    if(e.type==='turret'){
      const dist=player.x-e.x;
      if(Math.abs(dist)<e.detectRange&&!player.dead){
        e.facing=dist>0?1:-1;
        if(e.shootCD<=0){
          const bx=e.facing>0?e.x+e.w:e.x-8;
          projectiles.push({x:bx,y:e.y+4,vx:e.facing*4,vy:0,w:8,h:3,dmg:2,owner:'enemy',color:'#FF4444',life:60});
          SFX.kiShoot();e.shootCD=45;
        }
      }
      if(e.shootCD>0)e.shootCD--;
      e.animT=(e.animT||0)+1;e.frame=(e.animT/12|0)%2;
      if(player.invT<=0&&!player.dead&&aabb(e,player))playerTakeDamage(1);
    }
  }
}

// ===== BOSS: RADITZ =====
function makeRaditz(){
  return{type:'raditz',x:170*T,y:9*T,vx:0,vy:0,w:16,h:28,
    hp:15,maxHp:15,phase:1,facing:-1,frame:0,hitT:0,dead:false,
    ai:'idle',aiT:60,atkCD:0,animT:0};
}

function hitBoss(dmg){
  if(!boss||boss.dead||boss.hitT>0)return;
  boss.hp-=dmg;boss.hitT=15;
  emitP(boss.x+boss.w/2,boss.y+boss.h/2,8,'#FFF',3,12);
  shake(5);freezeFrames=4;SFX.kiHit();
  // Phase transitions
  if(currentLevel===5){
    if(boss.hp<=45&&boss.phase===1){boss.phase=2;boss.w=18;boss.h=26;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#F0F',5,25);}
    if(boss.hp<=30&&boss.phase===2){boss.phase=3;boss.w=16;boss.h=22;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#FFF',5,25);}
    if(boss.hp<=15&&boss.phase===3){boss.phase=4;boss.w=14;boss.h=20;shake(15);emitP(boss.x+boss.w/2,boss.y+boss.h/2,25,'#F44',6,30);}
  }else{
    if(boss.hp<=boss.maxHp*0.3&&boss.phase===2){boss.phase=3;shake(12);emitP(boss.x+boss.w/2,boss.y+boss.h/2,20,'#F44',5,25);}
    if(boss.hp<=boss.maxHp/2&&boss.phase===1){boss.phase=2;shake(10);emitP(boss.x+boss.w/2,boss.y+boss.h/2,15,'#F0F',4,20);}
  }
  if(boss.hp<=0){boss.dead=true;bossActive=false;bossDefeated=true;state=ST.CLEAR;clearT=0;
    emitP(boss.x+boss.w/2,boss.y+boss.h/2,30,C.kiYellow,5,30);SFX.clear();shake(15);
    // Open arena walls
    const walls=currentLevel>=2?[156,188]:[150,180];
    for(let y=0;y<ROWS;y++){level.tiles[y][walls[0]]=AIR;level.tiles[y][walls[1]]=AIR;}
  }
}

function updateBoss(){
  if(!boss||boss.dead)return;
  if(boss.hitT>0)boss.hitT--;
  boss.vy+=GRAVITY;if(boss.vy>MAX_FALL)boss.vy=MAX_FALL;
  boss.y+=boss.vy;collideY(boss);

  const spd=boss.phase===2?3:2;
  boss.facing=player.x<boss.x?-1:1;

  boss.aiT--;
  if(boss.aiT<=0){
    const r=Math.random();
    if(boss.ai==='idle'){
      if(r<0.5){boss.ai='charge';boss.aiT=40;boss.vx=boss.facing*spd;}
      else{boss.ai='shoot';boss.aiT=30;}
    }else if(boss.ai==='charge'){
      boss.ai='idle';boss.aiT=boss.phase===2?30:50;boss.vx=0;
    }else if(boss.ai==='shoot'){
      // Fire ki blast
      const bx=boss.facing>0?boss.x+boss.w:boss.x-8;
      projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*3.5,vy:0,w:8,h:6,dmg:1,owner:'enemy',color:'#D050FF',life:80});
      SFX.kiShoot();
      if(boss.phase===2){
        projectiles.push({x:bx,y:boss.y+10,vx:boss.facing*3,vy:-1.5,w:8,h:6,dmg:1,owner:'enemy',color:'#D050FF',life:80});
        if(r<0.3){// Saturday Crush
          setTimeout(()=>{
            if(boss&&!boss.dead){
              projectiles.push({x:bx,y:boss.y+5,vx:boss.facing*2.5,vy:0,w:14,h:12,dmg:2,owner:'enemy',color:'#FF00FF',life:100});
              shake(4);SFX.kiShoot();
            }
          },500);
        }
      }
      boss.ai='idle';boss.aiT=boss.phase===2?25:40;
    }
  }

  if(boss.ai==='charge'){boss.x+=boss.vx;
    // Bounce off arena walls
    if(boss.x<151*T){boss.x=151*T;boss.vx*=-1;}
    if(boss.x+boss.w>179*T){boss.x=179*T-boss.w;boss.vx*=-1;}
  }

  boss.animT++;boss.frame=(boss.animT/8|0)%2;

  // Damage player on contact
  if(player.invT<=0&&!player.dead&&aabb(boss,player))playerTakeDamage(1);
}

// ===== PROJECTILES =====
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    // Tile collision
    const tx=(p.x+p.w/2)/T|0,ty=(p.y+p.h/2)/T|0;
    if(isSolid(tx,ty)){
      emitP(p.x+p.w/2,p.y+p.h/2,4,p.color,2,8);
      // Break bricks
      if(isBreakable(tx,ty)&&p.owner==='player'){level.tiles[ty][tx]=AIR;emitP(tx*T+8,ty*T+8,6,C.brick,2,15);}
      projectiles.splice(i,1);continue;
    }
    if(p.life<=0){projectiles.splice(i,1);continue;}

    if(p.owner==='player'){
      for(const e of enemies){
        if(!e.dead&&aabb(p,e)){hitEnemy(e,p.dmg,p.vx>0?1:-1);emitP(p.x,p.y,4,p.color,2,8);projectiles.splice(i,1);break;}
      }
      if(boss&&!boss.dead&&aabb(p,boss)){hitBoss(p.dmg);emitP(p.x,p.y,4,p.color,2,8);if(projectiles[i])projectiles.splice(i,1);}
    }
    if(p.owner==='enemy'&&!player.dead&&player.invT<=0&&aabb(p,player)){
      playerTakeDamage(p.dmg);emitP(p.x,p.y,4,p.color,2,8);projectiles.splice(i,1);
    }
  }
}

// ===== DRAWING =====
function drawTiles(){
  const sx=(cam.x/T|0)-1,ex=sx+COLS+3;
  const sy=Math.max(0,cam.y/T|0),ey=Math.min(ROWS,sy+Math.ceil(GH/T)+2);
  const ox=-cam.x+cam.shakeX,oy=-cam.y+cam.shakeY;
  for(let ty=sy;ty<ey;ty++){
    for(let tx=sx;tx<ex;tx++){
      if(tx<0||tx>=level.width)continue;
      const t=level.tiles[ty][tx];
      const dx=tx*T+ox|0,dy=ty*T+oy|0;
      if(t===GRASS){cx.fillStyle=currentLevel===5?C.crumbleGrass:currentLevel===3?C.namekGrass:C.grass;cx.fillRect(dx,dy,T,T);cx.fillStyle=currentLevel===5?'#4A5A2A':currentLevel===3?'#1B8C5A':C.grassSide;cx.fillRect(dx,dy+3,T,T-3);}
      else if(t===DIRT){cx.fillStyle=currentLevel===5?C.crumbleDirt:currentLevel===3?'#2D6B4A':C.dirt;cx.fillRect(dx,dy,T,T);cx.fillStyle=currentLevel===5?'#3A2A1A':currentLevel===3?'#1A5238':C.dirtDark;cx.fillRect(dx+2,dy+4,4,4);cx.fillRect(dx+10,dy+8,3,3);}
      else if(t===PLAT){cx.fillStyle='#AA8855';cx.fillRect(dx,dy,T,4);cx.fillStyle='#886633';cx.fillRect(dx,dy+4,T,2);}
      else if(t===BRICK){cx.fillStyle=C.brick;cx.fillRect(dx,dy,T,T);cx.fillStyle=C.brickLine;cx.fillRect(dx,dy+7,T,2);cx.fillRect(dx+7,dy,2,T);}
      else if(t===WALL){cx.fillStyle=C.wall;cx.fillRect(dx,dy,T,T);cx.fillStyle='#555';cx.fillRect(dx+3,dy+3,4,4);cx.fillRect(dx+10,dy+9,4,4);}
      else if(t===METAL){cx.fillStyle=currentLevel===4?C.shipWall:C.metal;cx.fillRect(dx,dy,T,T);cx.fillStyle=currentLevel===4?'#7755BB':C.metalLight;cx.fillRect(dx,dy,T,1);cx.fillStyle=currentLevel===4?'#332244':C.metalDark;cx.fillRect(dx,dy+T-1,T,1);cx.fillRect(dx+7,dy+3,2,2);}
      else if(t===PANEL){cx.fillStyle=C.panelDark;cx.fillRect(dx,dy,T,T);cx.fillStyle=C.panelGreen;cx.fillRect(dx+3,dy+2,3,2);cx.fillRect(dx+3,dy+6,3,2);cx.fillRect(dx+3,dy+10,3,2);cx.fillRect(dx+10,dy+4,4,3);}
      else if(t===GRAV){cx.fillStyle=C.gravZone;cx.fillRect(dx,dy,T,T);if((tx+ty)%4===0){cx.fillStyle='rgba(255,0,100,0.08)';cx.fillRect(dx,dy,T,T);}}
      else if(t===LASER){const pulse=0.5+0.5*Math.sin(Date.now()/150+tx*2);cx.fillStyle=`rgba(255,34,34,${0.3*pulse})`;cx.fillRect(dx,dy,T,T);cx.fillStyle=C.laserRed;cx.globalAlpha=0.6+0.4*pulse;cx.fillRect(dx+6,dy,4,T);cx.globalAlpha=1;}
    }
  }
}

function drawGoku(px,py){
  if(player.dead)return;
  if(player.invT>0&&(player.invT%6<3))return; // flash
  const ox=-cam.x+cam.shakeX,oy=-cam.y+cam.shakeY;
  const x=px+ox|0,y=py+oy|0;
  const f=player.facing;
  const fd=FORM_DATA[FORMS[player.form]];

  // Aura
  if(fd.aura){
    cx.fillStyle=fd.aura;
    cx.beginPath();cx.ellipse(x+7,y+11,12,16,0,0,Math.PI*2);cx.fill();
  }

  // Transform flash
  if(player.transformT>0){
    cx.fillStyle=`rgba(255,255,200,${player.transformT/30*0.5})`;
    cx.beginPath();cx.arc(x+7,y+11,20+player.transformT,0,Math.PI*2);cx.fill();
    return;
  }

  const flip=f<0;
  cx.save();
  if(flip){cx.translate(x+player.w,0);cx.scale(-1,1);cx.translate(-x,0);}

  // Boots
  cx.fillStyle=C.giBoots;
  cx.fillRect(x+1,y+19,5,3);cx.fillRect(x+7,y+19,5,3);

  // Legs
  cx.fillStyle=C.giOrange;
  if(player.frame%2===1&&player.onGround){cx.fillRect(x+2,y+15,4,4);cx.fillRect(x+7,y+14,4,5);}
  else{cx.fillRect(x+2,y+14,4,5);cx.fillRect(x+7,y+14,4,5);}

  // Body
  cx.fillStyle=C.giOrange;cx.fillRect(x+1,y+8,11,7);
  cx.fillStyle=C.giBelt;cx.fillRect(x+1,y+13,11,2);

  // Arms
  cx.fillStyle=C.giOrange;
  if(player.meleeActive>0){
    // Punch arm extended
    cx.fillRect(x+11,y+9,7,3);
    cx.fillStyle=C.skin;cx.fillRect(x+17,y+9,3,3); // fist
  }else{
    cx.fillRect(x-1,y+9,3,5);cx.fillRect(x+11,y+9,3,5);
  }

  // Melee effect
  if(player.meleeActive>4){
    cx.fillStyle='rgba(255,255,255,0.6)';
    cx.beginPath();cx.arc(x+20,y+10,6,0,Math.PI*2);cx.fill();
  }

  // Head
  cx.fillStyle=C.skin;
  cx.beginPath();cx.arc(x+7,y+5,6,0,Math.PI*2);cx.fill();

  // Hair
  cx.fillStyle=fd.hairColor;
  if(fd.hairStyle==='ssj3'){
    cx.beginPath();
    cx.moveTo(x+1,y+5);cx.lineTo(x+2,y-8);cx.lineTo(x+4,y-2);
    cx.lineTo(x+5,y-10);cx.lineTo(x+7,y-3);
    cx.lineTo(x+8,y-9);cx.lineTo(x+10,y-2);
    cx.lineTo(x+11,y-7);cx.lineTo(x+13,y+5);
    cx.closePath();cx.fill();
    cx.fillRect(x-1,y+1,2,8);cx.fillRect(x+13,y+1,2,7);
    // Long flowing hair down back
    cx.fillRect(x+(f>0?-2:12),y+5,3,14);
    cx.fillRect(x+(f>0?-3:13),y+12,2,8);
    // Lightning sparks
    if(Math.random()<0.3){cx.fillStyle=C.ssj2Spark;cx.fillRect(x+Math.random()*14-2,y+Math.random()*20-5,2,2);}
  }else if(fd.hairStyle==='ssj2'){
    cx.beginPath();
    cx.moveTo(x+1,y+5);cx.lineTo(x+3,y-7);cx.lineTo(x+5,y+0);
    cx.lineTo(x+6,y-8);cx.lineTo(x+8,y-1);
    cx.lineTo(x+9,y-7);cx.lineTo(x+11,y+0);
    cx.lineTo(x+12,y-5);cx.lineTo(x+13,y+5);
    cx.closePath();cx.fill();
    cx.fillRect(x,y+1,2,6);cx.fillRect(x+12,y+1,2,5);
    // Lightning sparks
    if(Math.random()<0.2){cx.fillStyle=C.ssj2Spark;cx.fillRect(x+Math.random()*14,y+Math.random()*16-4,2,2);}
  }else if(fd.hairStyle==='ssj'){
    cx.beginPath();
    cx.moveTo(x+1,y+5);cx.lineTo(x+3,y-5);cx.lineTo(x+5,y+1);
    cx.lineTo(x+6,y-6);cx.lineTo(x+8,y+0);
    cx.lineTo(x+9,y-5);cx.lineTo(x+11,y+1);
    cx.lineTo(x+12,y-3);cx.lineTo(x+13,y+5);
    cx.closePath();cx.fill();
    cx.fillRect(x,y+1,2,6);cx.fillRect(x+12,y+1,2,5);
  }else{
    cx.beginPath();
    cx.moveTo(x+2,y+5);cx.lineTo(x+4,y-2);cx.lineTo(x+6,y+2);
    cx.lineTo(x+7,y-3);cx.lineTo(x+9,y+2);
    cx.lineTo(x+10,y-1);cx.lineTo(x+12,y+5);
    cx.closePath();cx.fill();
    cx.fillRect(x+1,y+2,2,5);
  }

  // Eyes
  cx.fillStyle='#FFF';cx.fillRect(x+4,y+3,3,3);cx.fillRect(x+8,y+3,3,3);
  cx.fillStyle='#111';cx.fillRect(x+5,y+4,2,2);cx.fillRect(x+9,y+4,2,2);

  // Mouth
  cx.fillStyle='#c88';cx.fillRect(x+6,y+8,3,1);

  cx.restore();
}

function drawItems(){
  const ox=-cam.x+cam.shakeX,oy=-cam.y+cam.shakeY;
  const t=Date.now()/300;
  for(const it of items){
    if(it.collected)continue;
    const bob=Math.sin(t+it.bob)*2;
    const ix=it.x+ox|0,iy=it.y+oy+bob|0;
    if(ix<-20||ix>GW+20)continue;
    if(it.type==='orb'){
      cx.fillStyle=C.orbGlow;cx.beginPath();cx.arc(ix,iy,4,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(255,255,200,0.4)';cx.beginPath();cx.arc(ix,iy,6,0,Math.PI*2);cx.fill();
    }
    if(it.type==='senzu'){
      cx.fillStyle=C.senzu;
      cx.fillRect(ix-2,iy-4,4,8);
      cx.beginPath();cx.arc(ix,iy-4,2,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(100,255,100,0.3)';cx.beginPath();cx.arc(ix,iy,8,0,Math.PI*2);cx.fill();
    }
    if(it.type==='dragonball'){
      cx.fillStyle=C.dbOrange;cx.beginPath();cx.arc(ix,iy,5,0,Math.PI*2);cx.fill();
      cx.fillStyle='rgba(255,200,0,0.3)';cx.beginPath();cx.arc(ix,iy,8,0,Math.PI*2);cx.fill();
      // Stars
      cx.fillStyle=C.dbStar;
      for(let s=0;s<it.stars;s++){cx.fillRect(ix-1+s*2,iy-1,2,2);}
    }
  }
}

  cx.fillText(FORMS[player.form].toUpperCase(),8,24);
  // Lives
  cx.fillText('x'+player.lives,50,24);

  // Ki meter
  cx.fillStyle=C.kiBg;cx.fillRect(GW-60,8,52,8);
  const kiW=(player.ki/player.maxKi)*50;
  cx.fillStyle=C.kiFill;cx.fillRect(GW-59,9,kiW,6);
  cx.fillStyle='#FFF';cx.fillText('KI',GW-60,24);

  // Score
  cx.fillStyle='#FFF';cx.font='7px monospace';
  cx.textAlign='center';cx.fillText(''+player.score,GW/2,14);cx.textAlign='left';

  // Dragon balls
  for(let i=0;i<7;i++){
    cx.fillStyle=i<player.dragonBalls?C.dbOrange:'#444';
    cx.beginPath();cx.arc(GW-50+i*8,28,3,0,Math.PI*2);cx.fill();
  }

  // Boss HP
  if(bossActive&&boss&&!boss.dead){
    cx.fillStyle=C.hpBg;cx.fillRect(GW/2-60,4,120,6);
    const bhp=(boss.hp/boss.maxHp)*118;
    cx.fillStyle=currentLevel===5?'#CC0033':currentLevel===4?'#8844BB':currentLevel===3?'#FF69B4':currentLevel===2?'#FF4488':'#D050FF';cx.fillRect(GW/2-59,5,bhp,4);
    cx.fillStyle='#FFF';cx.font='6px monospace';cx.textAlign='center';
    const bossName=currentLevel===5?'FRIEZA':currentLevel===4?'GINYU':currentLevel===3?'DODORIA':currentLevel===2?'GRAVITY BOT':'RADITZ';
    cx.fillText(bossName,GW/2,18);cx.textAlign='left';
  }
}

function drawTouchControls(){
  if(!isTouchDevice)return;
  cx.globalAlpha=0.3;
  // D-pad
  for(const b of touchBtns){
    if(b.r){
      cx.fillStyle=b.pressed?'#FFF':'#AAA';
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();
      cx.fillStyle='#333';cx.font='8px monospace';cx.textAlign='center';
      const label=b.id==='jump'?'JMP':b.id==='melee'?'HIT':b.id==='ki'?'KI':'SSJ';
      cx.font=b.id==='transform'?'6px monospace':'7px monospace';
      cx.fillText(label,b.x,b.y+3);cx.textAlign='left';
    }else{
      cx.fillStyle=b.pressed?'#FFF':'#AAA';
      cx.fillRect(b.x,b.y,b.w,b.h);
      cx.fillStyle='#333';cx.font='8px monospace';cx.textAlign='center';
      const label=b.id==='left'?'◀':b.id==='right'?'▶':'▲';
      cx.fillText(label,b.x+b.w/2,b.y+b.h/2+3);cx.textAlign='left';
    }
  }
  cx.globalAlpha=1;
}

  cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(0,0,GW,GH);

  const unlockMsg=currentLevel===1?'Kaioken Unlocked!':currentLevel===2?'Super Saiyan Unlocked!':currentLevel===3?'SSJ2 Unlocked!':currentLevel===4?'SSJ3 Unlocked!':'';
  if(unlockMsg)cx.fillText(unlockMsg,GW/2,GH/2+45);

  if(clearT>120){cx.font='10px monospace';
    const nextMsg=currentLevel<5?(isTouchDevice?'TAP FOR NEXT LEVEL':'PRESS ENTER FOR NEXT LEVEL'):(isTouchDevice?'TAP TO CONTINUE':'PRESS ENTER');
    cx.fillText(nextMsg,GW/2,GH/2+70);}

}

let tutPage=0;

      cx.fillStyle=['#FFD700','#FF6B00','#4CAF50','#FF4444','#FF8C00','#FFF'][i];
      cx.fillText(tips[i],GW/2,78+i*24);

// ===== INIT =====
const ENEMY_TYPES=['saibaman','dummy','dino','robot','drone','soldier','frog','cui','grunt','turret'];
function initGame(lvl){
  currentLevel=lvl||1;
  const builders={1:[buildLevel1,spawnEntities],2:[buildLevel2,spawnEntities2],3:[buildLevel3,spawnEntities3],4:[buildLevel4,spawnEntities4],5:[buildLevel5,spawnEntities5]};
  const [build,spawn]=builders[currentLevel];
  level.tiles=build();const e=spawn();enemies=e.filter(i=>ENEMY_TYPES.includes(i.type));items=e.filter(i=>!ENEMY_TYPES.includes(i.type));
  player.x=40;player.y=currentLevel>=2?12*T:10*T;player.vx=0;player.vy=0;
  player.form=currentLevel>=5?4:currentLevel>=4?3:currentLevel>=3?2:currentLevel===2?1:0;player.hp=5;
  if(lvl===1||!lvl){player.lives=3;player.ki=0;player.score=0;player.dragonBalls=0;maxForm=1;}
  if(currentLevel===5)lavaY=ROWS*T+50;
  player.dead=false;player.invT=0;player.meleeActive=0;player.meleeCD=0;player.kiCD=0;
  player.onGround=false;player.coyoteT=0;player.jumpBufT=0;player.transformT=0;
  projectiles=[];particles=[];
  boss=null;bossActive=false;bossDefeated=false;
  cam.x=0;cam.y=0;cam.shakeT=0;
  freezeFrames=0;orbCombo=0;
}

// ===== MAIN LOOP =====
function update(){
  if(freezeFrames>0){freezeFrames--;return;}

  if(state===ST.PLAY||state===ST.BOSS){
    updatePlayer();
    updateEnemies();
    if(bossActive){if(currentLevel===5)updateFrieza();else if(currentLevel===4)updateGinyu();else if(currentLevel===3)updateDodoria();else if(currentLevel===2)updateGravBot();else updateBoss();}
    if(currentLevel===5){lavaY-=0.04;if(lavaY<4*T)lavaY=4*T;}
    updateProjectiles();
    updateParticles();
    if(!player.dead)updateCam(player.x+player.w/2,player.y+player.h/2);
    // Reset orb combo if not collected recently
    if(orbCombo>0&&Date.now()%1000<20)orbCombo=Math.max(0,orbCombo-1);
    // Pause
    if(input.pause){state=ST.PAUSE;}
  }
  if(state===ST.INTRO){
    stateT--;
    if(stateT<=0){state=ST.BOSS;stateT=0;}
  }else{
    stateT++;
  }
}

function render(){
  cx.clearRect(0,0,GW,GH);

  if(state===ST.TITLE){drawTitle();return;}
  if(state===ST.TUT){drawTutorial();return;}

  // Game rendering
  drawBg();
  drawTiles();
  drawItems();
  for(const e of enemies)if(!e.dead){
    if(e.type==='saibaman')drawSaibaman(e);
    if(e.type==='dummy')drawDummy(e);
    if(e.type==='dino')drawDino(e);
    if(e.type==='robot')drawRobot(e);
    if(e.type==='drone')drawDrone(e);
    if(e.type==='soldier')drawSoldier(e);
    if(e.type==='frog')drawFrog(e);
    if(e.type==='cui')drawCui(e);
    if(e.type==='grunt')drawGrunt(e);
    if(e.type==='turret')drawTurret(e);
  }
  drawGoku(player.x,player.y);
  if(bossActive){if(currentLevel===5)drawFrieza();else if(currentLevel===4)drawGinyu();else if(currentLevel===3)drawDodoria();else if(currentLevel===2)drawGravBot();else drawRaditz();}
  if(currentLevel===5){const oy=-cam.y+cam.shakeY;const ly=lavaY+oy;if(ly<GH){cx.fillStyle=C.lavaOrange;cx.fillRect(0,ly,GW,GH-ly);cx.fillStyle=C.lavaDark;for(let i=0;i<30;i++){cx.fillRect((i*37+Date.now()/100)%GW,ly+Math.sin(Date.now()/200+i)*3,12,3);}cx.fillStyle=C.lavaGlow;cx.fillRect(0,ly-8,GW,8);}}
  drawProjectiles();
  drawParticles();
  drawHUD();
  drawTouchControls();

  if(state===ST.PAUSE)drawPause();
  if(state===ST.OVER)drawGameOver();
  if(state===ST.CLEAR)drawLevelClear();
  if(state===ST.INTRO)drawBossIntro();
}

let lastTime=0;
const FIXED_DT=1000/60;
let acc=0;

function loop(ts){
  const dt=Math.min(ts-lastTime,100);lastTime=ts;acc+=dt;

  updateInput();

  // State transitions from input
  if(state===ST.TITLE&&input.start){drawSecretEnding=false;state=ST.TUT;tutPage=0;titleBlink=0;stateT=0;}
  if(state===ST.TUT&&input.start){if(tutPage<1){tutPage++;titleBlink=0;}else{initGame();state=ST.PLAY;stateT=0;}}
  if(state===ST.PAUSE&&input.pause){state=bossActive?ST.BOSS:ST.PLAY;}
  if(state===ST.OVER&&stateT>60&&input.start){state=ST.TITLE;}
  if(state===ST.CLEAR&&clearT>120&&input.start){
    if(currentLevel===1){maxForm=2;initGame(2);state=ST.PLAY;stateT=0;}
    else if(currentLevel===2){maxForm=3;initGame(3);state=ST.PLAY;stateT=0;}
    else if(currentLevel===3){maxForm=3;initGame(4);state=ST.PLAY;stateT=0;}
    else if(currentLevel===4){maxForm=4;initGame(5);state=ST.PLAY;stateT=0;}
    else{
      if(player.dragonBalls>=7){state=ST.TITLE;drawSecretEnding=true;}
      else{state=ST.TITLE;}
    }
  }

  while(acc>=FIXED_DT){update();acc-=FIXED_DT;}
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
